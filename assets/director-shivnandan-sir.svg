<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Illustrative portrait of Shivnandan Sir, Director, Royal Defence Academy">
  <!-- Illustrative Representation (Not an actual photograph) -->
  <defs>
    <linearGradient id="bgGradShivnandan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>
    <clipPath id="circleClipShivnandan">
      <circle cx="80" cy="80" r="75" />
    </clipPath>
  </defs>

  <!-- Circular Base -->
  <circle cx="80" cy="80" r="78" fill="#0F172A" />
  <circle cx="80" cy="80" r="75" fill="url(#bgGradShivnandan)" />

  <g clip-path="url(#circleClipShivnandan)">
    <!-- Military / Formal Defence Blazer -->
    <path d="M 20 160 C 20 120 45 105 80 105 C 115 105 140 120 140 160 Z" fill="#1E3A8A" />
    <!-- Formal Epaulettes / Gold Trim -->
    <path d="M 40 115 L 56 112" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />
    <path d="M 120 115 L 104 112" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />
    <!-- Shirt Collar -->
    <polygon points="80,118 64,102 74,96 80,108 86,96 96,102" fill="#FFFFFF" />
    <!-- Tie -->
    <polygon points="77,108 83,108 86,145 80,152 74,145" fill="#DC2626" />
    <!-- Neck -->
    <rect x="71" y="80" width="18" height="24" fill="#D69466" rx="3" />
    <!-- Head / Face (Strong Jawline) -->
    <polygon points="56,50 104,50 102,80 80,95 58,80" fill="#E29C6D" />
    <!-- Ears -->
    <ellipse cx="53" cy="66" rx="4" ry="7" fill="#C98455" />
    <ellipse cx="107" cy="66" rx="4" ry="7" fill="#C98455" />
    <!-- Crew Cut / Short Military Hair -->
    <path d="M 54 48 C 54 26 66 22 80 22 C 94 22 106 26 106 48 C 106 45 102 32 94 30 C 86 28 74 28 66 30 C 58 32 54 45 54 48 Z" fill="#1E293B" />
    <!-- Eyebrows -->
    <path d="M 63 52 Q 71 49 77 52" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 83 52 Q 89 49 97 52" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Eyes -->
    <ellipse cx="70" cy="59" rx="3" ry="2" fill="#0F172A" />
    <ellipse cx="90" cy="59" rx="3" ry="2" fill="#0F172A" />
    <!-- Nose -->
    <path d="M 80 57 L 78 69 L 83 69" stroke="#B87347" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Determined Smile -->
    <path d="M 72 79 Q 80 84 88 79" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>
</svg>
