<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Illustrative portrait of Pravendra Shakya, Director, New Dastak Classes">
  <!-- Illustrative Representation (Not an actual photograph) -->
  <defs>
    <linearGradient id="bgGradPravendra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <clipPath id="circleClipPravendra">
      <circle cx="80" cy="80" r="75" />
    </clipPath>
  </defs>

  <!-- Circular Base -->
  <circle cx="80" cy="80" r="78" fill="#1E40AF" />
  <circle cx="80" cy="80" r="75" fill="url(#bgGradPravendra)" />

  <g clip-path="url(#circleClipPravendra)">
    <!-- Suit / Shoulders -->
    <path d="M 20 160 C 20 120 45 105 80 105 C 115 105 140 120 140 160 Z" fill="#0F172A" />
    <!-- Shirt Collar -->
    <polygon points="80,118 64,102 74,96 80,108 86,96 96,102" fill="#FFFFFF" />
    <!-- Tie -->
    <polygon points="77,108 83,108 86,145 80,152 74,145" fill="#1E40AF" />
    <!-- Neck -->
    <rect x="71" y="80" width="18" height="24" fill="#E2A77A" rx="3" />
    <!-- Head / Face -->
    <ellipse cx="80" cy="65" rx="26" ry="32" fill="#EAA77D" />
    <!-- Hair -->
    <path d="M 52 56 C 52 32 64 26 80 26 C 96 26 108 32 108 56 C 108 62 105 45 98 40 C 90 35 70 35 62 40 C 55 45 52 62 52 56 Z" fill="#1E293B" />
    <!-- Ears -->
    <ellipse cx="53" cy="66" rx="4" ry="7" fill="#DE976B" />
    <ellipse cx="107" cy="66" rx="4" ry="7" fill="#DE976B" />
    <!-- Eyebrows -->
    <path d="M 62 55 Q 70 52 76 55" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 84 55 Q 90 52 98 55" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Eyes -->
    <ellipse cx="69" cy="62" rx="3" ry="2" fill="#0F172A" />
    <ellipse cx="91" cy="62" rx="3" ry="2" fill="#0F172A" />
    <!-- Glasses -->
    <rect x="62" y="56" width="15" height="12" rx="3" stroke="#0F172A" stroke-width="2" fill="none" />
    <rect x="83" y="56" width="15" height="12" rx="3" stroke="#0F172A" stroke-width="2" fill="none" />
    <line x1="77" y1="62" x2="83" y2="62" stroke="#0F172A" stroke-width="2" />
    <!-- Nose -->
    <path d="M 80 62 L 78 72 L 83 72" stroke="#C67D50" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Smile -->
    <path d="M 72 80 Q 80 86 88 80" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>
</svg>
